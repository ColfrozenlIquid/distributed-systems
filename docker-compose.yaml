name: vs-praktikum
services:
  world-simulation:
    build:
      context: .
      dockerfile: ./services/simulation/Dockerfile
    container_name: world-simulation
    ports:
      - "50051:50051"
    healthcheck:
      test: ["CMD", "/grpc_health_probe", "-addr=:50051"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  control-center:
    build:
      context: .
      dockerfile: ./services/control-center/Dockerfile
    container_name: control-center
    ports:
      - "8080:8080"
    environment:
      CONTROL_CENTER_WORLD_SIMULATION_HOST: "world-simulation:50051"
    depends_on:
      world-simulation:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  sensor-1:
    build:
      context: .
      dockerfile: ./services/sensors/Dockerfile
    container_name: sensor-1
    environment:
      SENSOR_ID: "sensor-1"
      SENSOR_TYPE: "water_level"
      SENSOR_INTERVAL_MS: "1000"
      SENSOR_POSITION_X: "3"
      SENSOR_POSITION_Y: "3"
      SENSOR_BASE_STATION_HOST: "http://control-center:8080"
      SENSOR_WORLD_SIMULATION_HOST: "world-simulation:50051"
    depends_on:
      world-simulation:
        condition: service_healthy
        restart: true
      control-center:
        condition: service_healthy
        restart: true

  actor-1:
    build:
      context: .
      dockerfile: ./services/actors/Dockerfile
    environment:
      ACTOR_ID: "actor-1"
      ACTOR_TYPE: "rescue_vehicle"
      ACTOR_INTERVAL_MS: "1000"
      ACTOR_POSITION_X: "10"
      ACTOR_POSITION_Y: "10"
      ACTOR_BASE_STATION_HOST: "http://control-center:8080"
      ACTOR_WORLD_SIMULATION_HOST: "world-simulation:50051"
    depends_on:
      world-simulation:
        condition: service_healthy
        restart: true
      control-center:
        condition: service_healthy
        restart: true
