name: vs-praktikum

x-sensor-base: &sensor-base
  build:
    context: .
    dockerfile: ./services/sensors/Dockerfile
  depends_on:
    world-simulation:
      condition: service_healthy
      restart: true
    control-center:
      condition: service_healthy
      restart: true
    mqtt-broker:
      condition: service_healthy

services:
  world-simulation:
    build:
      context: .
      dockerfile: ./services/simulation/Dockerfile
    container_name: world-simulation
    ports:
      - "50051:50051"
    healthcheck:
      test: ["CMD", "/grpc_health_probe", "-addr=:50051"]
      interval: 2s
      timeout: 1s
      retries: 5
      start_period: 2s

  control-center:
    build:
      context: .
      dockerfile: ./services/control-center/Dockerfile
    container_name: control-center
    ports:
      - "8080:8080"
    environment:
      CONTROL_CENTER_WORLD_SIMULATION_HOST: "world-simulation:50051"
    depends_on:
      world-simulation:
        condition: service_healthy
        restart: true
      mqtt-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 2s
      timeout: 1s
      retries: 5
      start_period: 2s

  mqtt-broker:
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: mqtt-broker
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-i", "healthcheck", "-C", "1", "-W", "2"]
      interval: 5s
      timeout: 3s
      retries: 4
      start_period: 3s

  sensor-1:
    <<: *sensor-base
    container_name: sensor-1
    environment:
      SENSOR_ID: "sensor-1"
      SENSOR_TYPE: "water_level"
      SENSOR_INTERVAL_MS: "100"
      SENSOR_POSITION_X: "3"
      SENSOR_POSITION_Y: "3"
      SENSOR_BASE_STATION_HOST: "http://control-center:8080"
      SENSOR_WORLD_SIMULATION_HOST: "world-simulation:50051"

  sensor-2:
