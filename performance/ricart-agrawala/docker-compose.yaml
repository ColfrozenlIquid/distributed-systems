x-node-build: &node-build
  build:
    context: ../..
    dockerfile: performance/ricart-agrawala/Dockerfile
    args:
      BUILD_TARGET: node
  depends_on:
    proxy-setup:
      condition: service_completed_successfully
  networks: [meshnet]
  restart: unless-stopped

services:
  mqtt-broker:
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: mqtt-perf
    restart: unless-stopped
    networks: [meshnet]
    ports:
      - "1883:1883"
    volumes:
      - ../../mosquitto:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    healthcheck:
      test:
        [
          "CMD",
          "mosquitto_sub",
          "-t",
          "$$SYS/#",
          "-i",
          "healthcheck",
          "-C",
          "1",
          "-W",
          "2",
        ]
      interval: 5s
      timeout: 3s
      retries: 4
      start_period: 3s

  toxiproxy:
    image: shopify/toxiproxy:latest
    container_name: toxiproxy
    ports: ["8474:8474"]
    networks: [meshnet]

  # mqtt-tracer:
  #   build:
  #     context: ../..
  #     dockerfile: performance/ricart-agrawala/Dockerfile
  #     args:
  #       BUILD_TARGET: tracer
  #   container_name: mqtt-tracer
  #   environment:
  #     - MQTT_BROKER_URL=tcp://mqtt-broker:1883
  #     - SCENARIO=chaos
  #     - TRACE_OUTPUT_DIR=/data
  #   volumes:
  #     - ./metrics:/data
  #   depends_on:
  #     mqtt-broker:
  #       condition: service_healthy
  #   networks: [meshnet]
  #   restart: unless-stopped

  proxy-setup:
    build:
      context: ../..
      dockerfile: performance/ricart-agrawala/Dockerfile
      args:
        BUILD_TARGET: proxy-setup
    container_name: proxy-setup
    environment:
      - NUM_NODES=64
      - BROKER_ADDR=mqtt-broker:1883
      - TOXIPROXY_HOST=toxiproxy
      - SCENARIO=uniform
    depends_on:
      mqtt-broker:
        condition: service_healthy
      toxiproxy:
        condition: service_started
    networks: [meshnet]
    restart: "no"

  collector:
    build:
      context: ../..
      dockerfile: performance/ricart-agrawala/Dockerfile
      args:
        BUILD_TARGET: collector
    container_name: collector
    environment:
      - MQTT_BROKER_URL=tcp://mqtt-broker:1883
      - METRICS_CSV_PATH=/data/sync_delay.csv
    volumes:
      - ./metrics:/data
    depends_on:
      mqtt-broker:
        condition: service_healthy
    networks: [meshnet]
    restart: unless-stopped

  node-0:
    <<: *node-build
    container_name: node-0
    environment:
      - NODE_ID=node-0
      - MQTT_BROKER_HOST=toxiproxy
      - MQTT_BROKER_PORT=21000
      - RESOURCE_ID=charging-station

  node-1:
