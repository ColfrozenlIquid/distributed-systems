syntax = "proto3";

import "actor.proto";

option go_package = "./proto";

service WorldService {
  rpc TileReading(TileReadingRequest) returns (TileReadingResponse);

  rpc TileUpdate(TileUpdateRequest) returns (TileUpdateResponse);

  rpc WorldData(WorldDataRequest) returns (WorldDataResponse);

  rpc MoveTo(MoveToRequest) returns (MoveToResponse);

  rpc PathTo(PathToRequest) returns (PathToResponse);
}

message WorldPosition {
  int32 x = 1;
  int32 y = 2;
}

message PathToRequest {
  WorldPosition source = 1;
  WorldPosition destination = 2;
  MovableType movable_type = 3;
}

message PathToResponse {
  repeated WorldPosition path = 1; // returns the next tile steps to reach destination including destination
}

message MoveToRequest {
  int32 x_pos = 1;
  int32 y_pos = 2;
  MovableType movable_type = 3;
}

message MoveToResponse {
  bool allowed = 1;
}

message TileReadingRequest {
  int32 x_pos = 1;
  int32 y_pos = 2;
  SensorType sensor_type = 3;
}

message TileReadingResponse {
  SensorType sensor_type = 1;
  float sensor_reading = 2;
}

enum SensorType {
  SENSOR_TYPE_UNSPECIFIED = 0;
  SENSOR_TYPE_VIBRATION = 1;
  SENSOR_TYPE_WATER_LEVEL = 2;
  SENSOR_TYPE_SUPPLY_LEVEL = 3;
  SENSOR_TYPE_PERSON_CONFIDENCE = 4;
}

message TileUpdateRequest {
  int32 x_pos = 1;
  int32 y_pos = 2;
  SensorType sensor_type = 3;
  float value = 4;
  bool default = 5;
}

message TileUpdateResponse {
  bool success = 1;
}

message WorldDataRequest {}

message TileState {
  TerrainType terrain = 1;
  InfrastructureType infrastructure = 2;
}

message WorldDataResponse {
  int32 width = 1;
  int32 height = 2;
  repeated TileState tiles = 3; // row-major: index = y*width + x
}

enum TerrainType {
  TERRAIN_TYPE_UNSPECIFIED = 0;
  TERRAIN_TYPE_LAND = 1;
  TERRAIN_TYPE_WATER = 2;
}

enum InfrastructureType {
  INFRASTRUCTURE_TYPE_UNSPECIFIED = 0;
  INFRASTRUCTURE_TYPE_NONE = 1;
  INFRASTRUCTURE_TYPE_CONTROL_CENTER = 2;
  INFRASTRUCTURE_TYPE_BRIDGE = 3;
  INFRASTRUCTURE_TYPE_CHARGING_STATION = 4;
  INFRASTRUCTURE_TYPE_PORT = 5;
  INFRASTRUCTURE_TYPE_DEPOT = 6;
  INFRASTRUCTURE_TYPE_LANDING_STRIP = 7;
}

enum MovableType {
  MOVABLE_TYPE_UNSPECIFIED = 0;
  MOVABLE_TYPE_LAND = 1;
  MOVABLE_TYPE_WATER = 2;
  MOVABLE_TYPE_AIR = 3;
  MOVABLE_TYPE_AMPHIBIOUS = 4;
}
