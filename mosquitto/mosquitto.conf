listener 1883
protocol mqtt

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice

allow_anonymous true

# Increase the number of QoS messages allowed in flight
max_inflight_messages 100

# (Optional) Increase queued messages if you have bursts
max_queued_messages 1000
